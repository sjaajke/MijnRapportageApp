name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          zip -r -X MijnRapportage-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/MijnRapportage-ios-unsigned.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Codesign app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Signing with identity: $IDENTITY"

          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null | while read -r item; do
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$item"
          done

          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package .app for notarization
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app MijnRapportage-macos-notarize.zip

      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          xcrun notarytool submit build/macos/Build/Products/Release/MijnRapportage-macos-notarize.zip \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          xcrun stapler staple "$APP_PATH"

      - name: Package signed & notarized .app
        run: |
          cd build/macos/Build/Products/Release
          rm -f MijnRapportage-macos-notarize.zip
          APP_PATH=$(find . -maxdepth 1 -name "*.app")
          # Use ditto, not zip: zip dereferences the symlinks inside
          # .framework bundles (e.g. Versions/Current), which corrupts
          # the bundle structure and makes Gatekeeper reject the app.
          ditto -c -k --keepParent "$APP_PATH" MijnRapportage-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/MijnRapportage-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Package build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MijnRapportage-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: MijnRapportage-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../MijnRapportage-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: MijnRapportage-linux.tar.gz

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package build
        run: |
          cd build/web
          zip -r -X ../../MijnRapportage-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: MijnRapportage-web.zip

  release:
    needs:
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
      - build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/android-apk/app-release.apk \
            artifacts/ios-app/MijnRapportage-ios-unsigned.zip \
            artifacts/macos-app/MijnRapportage-macos.zip \
            artifacts/windows-app/MijnRapportage-windows.zip \
            artifacts/linux-app/MijnRapportage-linux.tar.gz \
            artifacts/web-app/MijnRapportage-web.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
